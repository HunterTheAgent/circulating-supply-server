name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Syntax check
        run: python -m compileall -q api tests

      - name: Run tests
        # tests/ currently holds empty stubs; --exitfirst keeps this honest
        # once real cases land. No tests collected is not a failure today.
        run: pytest -q || [ $? -eq 5 ]
